<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NextelOS v0.0.5</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='20' font-size='20'>🖥️</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="desktop"></div>
    <div id="widgets">
        <div class="widget-clock" id="widget-clock">
            <div class="time" id="widget-time">00:00:00</div>
            <div class="date" id="widget-date">1 января 2026</div>
        </div>
        <div class="widget-weather" id="widget-weather" style="display:none">
            <div class="temp" id="widget-temp">--°C</div>
            <div class="desc" id="widget-desc">--</div>
        </div>
        <div class="widget-sysinfo" id="widget-sysinfo">
            <div class="row"><span class="label">CPU</span><span class="value" id="widget-cpu">0%</span></div>
            <div class="row"><span class="label">Память</span><span class="value" id="widget-memory">0 MB</span></div>
            <div class="row"><span class="label">Время работы</span><span class="value" id="widget-uptime">00:00:00</span></div>
            <canvas id="cpu-chart" width="200" height="40"></canvas>
        </div>
    </div>
    <div id="taskbar">
        <button id="start-btn">
            <span class="icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4l16 8L4 20V4z"/></svg></span>
            Пуск
        </button>
        <button id="collapse-all-btn">
            <span class="icon"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><path d="M5 12h14M12 5v14"/></svg></span>
        </button>
        <div id="taskbar-windows"></div>
        <button id="tray-btn" title="Системный трей">🔊</button>
        <span id="taskbar-clock">00:00:00</span>
    </div>
    <div id="system-tray">
        <div class="tray-item"><span>🔊</span><input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.5"><span id="volume-label">50%</span></div>
        <div class="tray-item"><span>📶</span><span id="network-status">Онлайн</span></div>
        <div class="tray-item"><span>🔋</span><span id="battery-status">100%</span></div>
        <div class="tray-item"><span>🔕</span><label><input type="checkbox" id="do-not-disturb"> Не беспокоить</label></div>
    </div>
    <div id="notifications"></div>
    <div id="context-menu"></div>
    <div id="dialog-overlay">
        <div id="dialog-box">
            <h3 id="dialog-title">Подтверждение</h3>
            <p id="dialog-message" style="margin-bottom:12px;">Вы уверены?</p>
            <input id="dialog-input" type="text" placeholder="Введите название..." style="display:none;">
            <div class="dialog-buttons">
                <button class="btn-cancel" id="dialog-cancel">Отмена</button>
                <button class="btn-confirm" id="dialog-confirm">OK</button>
            </div>
        </div>
    </div>
    <div id="selection-rect"></div>
    <script src="app.js"></script>
</body>
</html>
