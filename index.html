                    if (!list) return;
                    const procs = getProcessList();
                    list.innerHTML = '';
                    if (procs.length === 0) {
                        list.innerHTML = '<div style="color:#888;">Нет запущенных процессов</div>';
                        return;
                    }
                    procs.forEach(p => {
                        const div = document.createElement('div');
                        div.className = 'process-item';
                        div.innerHTML = `
                            <span class="proc-name">${p.title}</span>
                            <span class="proc-id">PID: ${p.id}</span>
                            <button data-pid="${p.id}">Завершить</button>
                        `;
                        const killBtn = div.querySelector('button');
                        killBtn.addEventListener('click', () => {
                            if (confirm(`Завершить процесс "${p.title}"?`)) {
                                killProcess(p.id);
                                renderProcesses();
                                showNotification(`Процесс "${p.title}" завершён`);
                            }
                        });
                        list.appendChild(div);
                    });
                };

                setTimeout(renderProcesses, 100);
            }

            // ----- 6.7 Корзина -----
            async function openTrash() {
                const content = `
                    <div class="trash-toolbar">
                        <button id="trash-empty">Очистить корзину</button>
                        <button id="trash-refresh">🔄 Обновить</button>
                    </div>
                    <div id="trash-list"></div>
                `;
                const winId = createWindow('Корзина', content, { width: 500, height: 350 });

                const renderTrash = async () => {
                    const list = document.getElementById('trash-list');
                    if (!list) return;
                    try {
                        const items = await FS.ls('/system/trash');
                        list.innerHTML = '';
                        if (items.length === 0) {
                            list.innerHTML = '<div class="trash-empty">Корзина пуста</div>';
                            return;
                        }
                        for (const name of items) {
                            const fullPath = '/system/trash/' + name;
                            const stat = await FS.stat(fullPath);
                            const isFolder = stat && stat.type === 'folder';
                            const div = document.createElement('div');
                            div.className = 'trash-item';
                            div.innerHTML = `
                                <span class="trash-icon">${isFolder ? '📁' : '📄'}</span>
                                <span class="trash-name">${name}</span>
                                <span class="trash-actions">
                                    <button class="restore-btn" data-path="${fullPath}" data-name="${name}">↩️ Восстановить</button>
                                    <button class="delete-btn" data-path="${fullPath}" data-name="${name}">🗑 Удалить навсегда</button>
                                </span>
                            `;
                            // Восстановление
                            const restoreBtn = div.querySelector('.restore-btn');
                            restoreBtn.addEventListener('click', async (e) => {
                                e.stopPropagation();
                                try {
                                    const destPath = '/home/user/' + name;
                                    // Проверяем, не существует ли уже
                                    const existing = await FS.stat(destPath);
                                    if (existing) {
                                        if (!confirm(`Файл "${name}" уже существует в домашней папке. Заменить?`)) return;
                                        await FS.rm(destPath);
                                    }
                                    // Копируем содержимое
                                    if (stat.type === 'file') {
                                        const content = await FS.cat(fullPath);
                                        await FS.touch(destPath, content);
                                    } else {
                                        // Папки пока не поддерживаем
                                        showNotification('Восстановление папок пока не поддерживается', 'warning');
                                        return;
                                    }
                                    // Удаляем из корзины
                                    await FS.rm(fullPath);
                                    showNotification(`"${name}" восстановлен`);
                                    renderTrash();
                                } catch(err) {
                                    showNotification('Ошибка: ' + err.message, 'error');
                                }
                            });
                            // Удаление навсегда
                            const deleteBtn = div.querySelector('.delete-btn');
                            deleteBtn.addEventListener('click', async (e) => {
                                e.stopPropagation();
                                if (confirm(`Удалить "${name}" навсегда?`)) {
                                    try {
                                        await FS.rm(fullPath);
                                        showNotification(`"${name}" удалён навсегда`);
                                        renderTrash();
                                    } catch(err) {
                                        showNotification('Ошибка: ' + err.message, 'error');
                                    }
                                }
                            });
                            list.appendChild(div);
                        }
                    } catch(e) {
                        list.innerHTML = `<div style="color:#ff5555;">Ошибка: ${e.message}</div>`;
                    }
                };

                setTimeout(() => {
                    const emptyBtn = document.getElementById('trash-empty');
                    const refreshBtn = document.getElementById('trash-refresh');
                    if (emptyBtn) {
                        emptyBtn.addEventListener('click', async () => {
                            if (confirm('Очистить корзину навсегда?')) {
                                try {
                                    const items = await FS.ls('/system/trash');
                                    for (const name of items) {
                                        await FS.rm('/system/trash/' + name);
                                    }
                                    showNotification('Корзина очищена');
                                    renderTrash();
                                } catch(err) {
                                    showNotification('Ошибка: ' + err.message, 'error');
                                }
                            }
                        });
                    }
                    if (refreshBtn) {
                        refreshBtn.addEventListener('click', renderTrash);
                    }
                    renderTrash();
                }, 100);
            }

            // ============================================================
            //  7. МЕНЮ ПУСК
            // ============================================================
            document.getElementById('start-btn').addEventListener('click', () => {
                const apps = getAllApps();
                let menuHTML = '<div id="start-menu" style="display:flex; flex-direction:column; gap:6px;"></div>';
                const winId = createWindow('Пуск', menuHTML, { width: 240, height: 350, left: 10, top: 80 });

                setTimeout(() => {
                    const menuContainer = document.getElementById('start-menu');
                    if (!menuContainer) return;
                    apps.forEach(app => {
                        const btn = document.createElement('button');
                        btn.style.cssText = 'background:rgba(255,255,255,0.05); border:none; color:white; padding:8px 12px; border-radius:4px; text-align:left; font-size:14px; transition:background 0.2s; cursor:pointer;';
                        btn.textContent = `${app.icon} ${app.label}`;
                        btn.addEventListener('mouseenter', () => btn.style.background = 'rgba(255,255,255,0.15)');
                        btn.addEventListener('mouseleave', () => btn.style.background = 'rgba(255,255,255,0.05)');
                        btn.addEventListener('click', () => {
                            const winEl = document.querySelector(`.window[data-window-id="${winId}"]`);
                            if (winEl) {
                                const id = parseInt(winEl.dataset.windowId);
                                if (id) closeWindow(id);
                            }
                            app.action();
                        });
                        menuContainer.appendChild(btn);
                    });
                }, 100);
            });

            // ============================================================
            //  8. ВОССТАНОВЛЕНИЕ НАСТРОЕК
            // ============================================================
            function restoreSettings() {
                const savedTheme = localStorage.getItem('nextelos-theme');
                if (savedTheme === 'light') {
                    document.body.classList.add('light-theme');
                }
                const savedWallpaper = localStorage.getItem('nextelos-wallpaper');
                if (savedWallpaper) {
                    document.getElementById('desktop').style.backgroundImage = `url("${savedWallpaper}")`;
                    document.getElementById('desktop').style.backgroundSize = 'cover';
                }
            }

            // ============================================================
            //  9. ИНИЦИАЛИЗАЦИЯ
            // ============================================================
            loadIconPositions();

            FS.init()
                .then(() => {
                    fsReady = true;
                    restoreSettings();
                    renderDesktopIcons();
                    showNotification('NextelOS загружена. Перетаскивай иконки, правый клик для меню.');
                    setTimeout(() => {
                        createWindow('Привет', '👋 Добро пожаловать в <b>NextelOS</b>!<br>Иконки можно перетаскивать, файлы удаляются в корзину.');
                    }, 500);
                })
                .catch(err => {
                    console.error('Ошибка инициализации:', err);
                    showNotification('Ошибка загрузки системы', 'error');
                });

            // Экспорт для глобального доступа
            window.closeWindow = closeWindow;
            window.openTerminal = openTerminal;
            window.openFileManager = openFileManager;
            window.openEditor = openEditor;
            window.openCalculator = openCalculator;
            window.openSettings = openSettings;
            window.openProcessManager = openProcessManager;
            window.openTrash = openTrash;
            window.createWindow = createWindow;
            window.showNotification = showNotification;
            window.renderDesktopIcons = renderDesktopIcons;

            console.log('NextelOS загружена!');
        })();
    </script>
</body>
</html>
